name: MVC
version: 0.1.0
description: Apporte à Grav une couche « routes -> controller » minimaliste et réutilisable (Grav n'a pas de MVC natif).
icon: plug
author:
  name: Guillon Flavien
homepage: https://github.com/flavi1/grav-mvc
license: MIT

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
